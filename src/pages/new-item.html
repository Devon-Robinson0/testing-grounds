<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page Cal Tracker</title>
    <link rel="stylesheet" href="../assets/global-css/global.css" />
    <link rel="stylesheet" href="./css/new-item.css" />

    <link rel="manifest" href="../manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/daily-macro-abstract.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/daily-macro-abstract.svg" />
</head>
<body>
    <nav class="desktop-nav">
        <a id="logo-and-text" href="index.html">
            <img id="daily-macro-logo-desktop" src="../assets/icons/daily-macro-abstract.svg" />
            <h1>daily macro</h1>
        </a>

        <div class="link-holder">
            <a href="index.html" class="active">Daily</a>
            <a href="settings.html">Settings</a>
        </div>
    </nav>
    <main>
        <h1 class="mobile-header">daily macro</h1>
        <img id="daily-macro-logo" src="../assets/icons/daily-macro-abstract.svg" />

        <a href="index.html" class="back-link">&lt; Back to daily</a>
        <!-- <h2 class="header">Add item</h2>
        <p class="today-text">Adding to today</p> -->

        <div id="today-desktop">
            <h2>Add item</h2>
            <p>Adding to today</p>
        </div>
        
        <div id="form-choose-fav">
            <div class="container">
                <h2 class="header">Create new</h2>
                <div class="error-box">
                    <img src="../assets/icons/error-icon.svg" />
                    <div class="error-message-container">
                        <h3 class="error-count">Please check <span>2</span> fields</h3>
                    </div>
                </div>
                <form id="create-item-form">
                    <div class="form-input long-input">
                        <label for="item-name-input">Item Name:</label>
                        <input id="item-name-input" type="text" placeholder="e.g. egg's on toast" aria-describedby="name-error" />
                        <p id="name-error" class="error-text" hidden>Enter an item name</p>
                    </div>
                    
                    <div class="form-input" >
                        <label for="item-cal-input">Calories</label>
                        <input id="item-cal-input" type="number" min="1" max="10000" step="100" placeholder="kcal" aria-describedby="cal-error" />
                        <p id="cal-error" class="error-text" hidden>Enter a calorie amount</p>
                    </div>

                    <div class="form-input">
                        <label for="item-type-input">Meal type</label>
                        <select id="item-type-input">
                            <option value="breakfast">Breakfast</option>
                            <option value="brunch">Brunch</option>
                            <option value="lunch" selected>Lunch</option>
                            <option value="dinner">Dinner</option>
                            <option value="snack">Snack</option>
                        </select>
                    </div>

                    <div class="save-to-fav-btn-container long-input beside">
                        <input id="save-to-fav-btn" type="checkbox" />
                        <label for="save-to-fav-btn">Save to favourites</label>
                    </div>

                    <button id="add-item-btn" type="button" class="long-input">Add new item</button>
                </form>
            </div>
            
            <div class="container">
                <h2>Or choose a favourite</h2>
                <ul id="favourites-list">
                    
                </ul>
            </div>
        </div>
    </main>
    <nav class="mobile-nav">
        <a href="index.html" class="active">Daily</a>
        <a href="settings.html">Settings</a>
    </nav>
    <script src="js/new-item.js"></script>
</body>
</html>
