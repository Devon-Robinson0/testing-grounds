<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page Cal Tracker</title>
    <link rel="stylesheet" href="../assets/global-css/global.css" />
    <link rel="stylesheet" href="./css/home.css" />
</head>
<body>
    <main>
        <h1>daily macro</h1>
        <h2>Today</h2>
        <p>Mon, 21 September</p>

        <div id="cal-stats">
            <div id="tdee-stat" class="cal-card">
                <p>estimated TDEE</p>
                <h3 class="pair"><span id="estimated-tdee">2,400</span> kcal / day</h3>
            </div>
            <div id="consumed-stat" class="cal-card">
                <p>consumed</p>
                <h3 id="consumed-cal">0</h3>
                <p>kcal logged</p>
            </div>
            <div id="balance-stat" class="cal-card">
                <p>balance</p>
                <h3 id="balance-cal">0</h3>
                <p>kcal | <span id="sur-or-def-text">deficit</span></p>
            </div>
        </div>

        <div id="food-log-container">
            <h3 id="food-log-text">Food Log</h3>

            <ul id="food-log">
    
            </ul>
            <button id="add-item-btn">&plus;Add item</button>
        </div>
    </main>
    <nav>
        <a href="index.html" class="active">Daily</a>
        <a href="settings.html">Settings</a>
    </nav>

    <script src="js/home.js" ></script>
</body>
</html>
