<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page Cal Tracker</title>
    <link rel="stylesheet" href="../assets/global-css/global.css" />
    <link rel="stylesheet" href="./css/home.css" />
</head>
<body>
    <main>
        <h1>daily macro</h1>
        <h2>Today</h2>
        <p>Mon, 21 September</p>

        <div id="cal-stats">
            <div id="tdee-stat" class="cal-card">
                <p>estimated TDEE</p>
                <h3 id="estimated-tdee">2,400 <span>kcal / day</span></h3>
            </div>
            <div id="consumed-stat" class="cal-card">
                <p>consumed</p>
                <h3 id="consumed-cal">1,844</h3>
                <p>kcal logged</p>
            </div>
            <div id="balance-stat" class="cal-card">
                <p>balance</p>
                <h3 id="balance-cal">-560</h3>
                <p>kcal deficit</p>
            </div>
        </div>

        <div id="food-log-container">
            <h3 id="food-log-text">Food Log</h3>

            <ul id="food-log">
                <li class="food-item">
                    <div class="item-name-content">
                        <h2 class="item-name">Item Name</h2>
                        <p class="item-time">breakfast</p>
                    </div>
                    <div class="item-cals">
                        <h2>322</h2>
                        <p>kcal</p>
                    </div>
                    <div class="item-favouriting">
                        <img src="../assets/icons/hollow-star-icon.svg" />
                    </div>
                </li>
            </ul>
            <button id="add-item-btn">&plus;Add item</button>
        </div>
    </main>
</body>
</html>
