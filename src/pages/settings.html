<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page Cal Tracker</title>
    <link rel="stylesheet" href="../assets/global-css/global.css" />
    <link rel="stylesheet" href="./css/settings.css" />
</head>
<body>
    <main>
        <h1>daily macro</h1>

        <h2>Settings</h2>
        <p>Your profile, your daily estimate</p>

        <div id="settings-container">
            <div class="setting">
                <label for="age-input">Age</label>
                <input id="age-input" type="number" placeholder="years" />
            </div>
            <div class="setting">
                <label for="gender-dropdown">Gender</label>
                <select id="gender-dropdown">
                    <option value="male" selected >Male</option>
                    <option value="female" >Female</option>
                </select>
            </div>
            <div class="setting">
                <label for="weight-input">Weight</label>
                <input id="weight-input" type="number" placeholder="kg" />
            </div>
            <div class="setting">
                <label for="height-input">Height</label>
                <input id="height-input" type="number" placeholder="cm" />
            </div>
            <div id="activity-level" class="setting">
                <label for="gender-dropdown">Activity level</label>
                <select id="gender-dropdown">
                    <option value="sedentary" selected >Sedentary (little to no excercise)</option>
                    <option value="lightly-active" >Lightly Active (1-3 days per week)</option>
                    <option value="moderately-active" >Moderately-active Active (3-5 days per week)</option>
                    <option value="very-active" >Very Active (6-7 days per week)</option>
                    <option value="extra-active" >Extra Active (very hard training)</option>
                </select>
            </div>
        </div>

        <article id="est-card">
            <p>Your daily estimate</p>
            <h2>2,400 <span>kcal/day</span></h2>
            <p>Updates when you save your changes</p>
        </article>

        <button id="save-btn">Save changes</button>
        <button id="cancel-btn">Cancel</button>

    </main>
    <nav>
        <a href="index.html" class="active">Daily</a>
        <a href="settings.html">Settings</a>
    </nav>
</body>
</html>
