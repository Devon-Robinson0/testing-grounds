<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Cal Tracker</title>
    <link rel="stylesheet" href="styles/daily.css" />
</head>
<body>
    <header>
        <h2>TDEE: </h2>
        <h3>Consumed: </h2>
        <h3>Cal-def-or-sur</h3>
    </header>
    <main>
        <ul id="meal-list">
            
        </ul>
        <button id="add-btn">Add</button>

        <article id="meal-edit-modal" hidden>
            <div class="input-container">
                <label for="meal-name-input">Name: </label>
                <input id="meal-name-input" type="text" placeholder="e.g. eggs" />
            </div>
            <div class="input-container">
                <label for="meal-cal-input">Calories: </label>
                <input id="meal-cal-input" type="number" placeholder="XXX" />
            </div>

            <ul id="fav-meal-list">

            </ul>

            <div class="edit-btn-container">
                <button id="cancel-edit-btn">Cancel</button>
                <button id="save-edit-btn">Save</button>
            </div>
        </article>
    </main>
    <script src="js/daily.js"></script>
</body>
</html>
